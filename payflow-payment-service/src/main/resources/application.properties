spring.application.name=payflow-payment-service
server.port=8080

# =============================================================================
# DATASOURCE — PostgreSQL
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5440/payflow_db
spring.datasource.username=payflow
spring.datasource.password=payflow_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool (Spring Boot's default pool)
# CONCEPT: A connection pool reuses DB connections instead of opening a new one
# per request. Opening a TCP connection to Postgres is expensive (~5-10ms).
# Under load, without a pool, you'd exhaust DB connections instantly.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=validate
# IMPORTANT: ddl-auto=validate means Hibernate checks that the DB schema matches
# your entities but does NOT create/alter tables. Flyway owns schema creation.
# Never use ddl-auto=create or update in anything resembling production.

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================================================
# FLYWAY
# =============================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# =============================================================================
# REDIS — Idempotency cache
# CONCEPT: Redis gives us a fast distributed check before hitting the DB.
# On every incoming payment request, we check Redis first:
#   - Key exists? Return cached response immediately (no DB hit)
#   - Key missing? Proceed to DB insert
# TTL (time-to-live) prevents the cache from growing forever.
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6382
spring.data.redis.timeout=2000ms

# =============================================================================
# KAFKA — Event publishing
# CONCEPT: The payment service only PRODUCES events (writes to Kafka).
# It never consumes. Producer config focuses on durability guarantees.
# =============================================================================
spring.kafka.bootstrap-servers=localhost:9092

# acks=all means: the leader AND all in-sync replicas must acknowledge the write
# before the producer considers it successful. Strongest durability guarantee.
# Tradeoff: slightly higher latency vs acks=1 (leader only) or acks=0 (fire and forget)
spring.kafka.producer.acks=all

# If a transient failure occurs, retry up to 3 times before giving up
spring.kafka.producer.retries=3

# Kafka batches messages for efficiency. Wait up to 5ms to fill a batch.
# Tradeoff: slightly higher latency, much better throughput under load.
spring.kafka.producer.properties.linger.ms=5

# Serialize messages as JSON
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Topic names — centralised here so they're easy to change
payflow.kafka.topics.payment-initiated=payment.initiated
payflow.kafka.topics.payment-completed=payment.completed
payflow.kafka.topics.payment-failed=payment.failed

# Outbox poller interval in milliseconds
payflow.outbox.poll-interval-ms=5000

# =============================================================================
# ACTUATOR — health, metrics, info endpoints
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
