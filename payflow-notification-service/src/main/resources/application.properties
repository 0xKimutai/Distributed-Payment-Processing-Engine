spring.application.name=payflow-notification-service
server.port=8084

# =============================================================================
# KAFKA — CONSUMER only. This service never produces to Kafka.
# It reads COMPLETED and FAILED payment results, then routes them to RabbitMQ.
#
# CONCEPT — Why a different consumer group than the processor?
#   group-id = payflow-notification-group  (NOT payflow-processor-group)
#
#   Each consumer group gets its OWN independent copy of every Kafka message.
#   The processor-group and notification-group both read payment.completed —
#   Kafka delivers the message to ONE consumer in EACH group.
#
#   This is the key difference from a queue (RabbitMQ/SQS): in a queue,
#   one consumer gets the message and it's gone. In Kafka, every group
#   gets a full copy. This is why Kafka is called a "pub/sub log" not a queue.
# =============================================================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=payflow-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# =============================================================================
# RABBITMQ
# CONCEPT — AMQP (Advanced Message Queuing Protocol):
#   RabbitMQ uses the AMQP protocol. The key entities are:
#
#   EXCHANGE — receives messages from producers. Doesn't store them.
#              Routes them to queues based on routing rules.
#
#   QUEUE    — stores messages until a consumer reads them.
#              Unlike Kafka, messages are DELETED after delivery.
#
#   BINDING  — a rule connecting an exchange to a queue.
#              "Send messages with routing key payment.* to email.queue"
#
#   PRODUCER → EXCHANGE → (binding rules) → QUEUE → CONSUMER
#
#   This is fundamentally different from Kafka's model:
#   Kafka: PRODUCER → TOPIC → (partitions) → CONSUMER GROUP
# =============================================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=payflow
spring.rabbitmq.password=payflow_secret

# Exchange and queue names — centralised here
payflow.rabbitmq.exchange=payment.results
payflow.rabbitmq.queues.email=email.notifications
payflow.rabbitmq.queues.sms=sms.notifications
payflow.rabbitmq.queues.webhook=webhook.notifications

# Routing keys — used by the topic exchange to route messages
# payment.completed → email + sms + webhook
# payment.failed    → email only (don't SMS/webhook on failure)
payflow.rabbitmq.routing-keys.completed=payment.completed
payflow.rabbitmq.routing-keys.failed=payment.failed

# Kafka topic names this service consumes from
payflow.kafka.topics.payment-completed=payment.completed
payflow.kafka.topics.payment-failed=payment.failed

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
