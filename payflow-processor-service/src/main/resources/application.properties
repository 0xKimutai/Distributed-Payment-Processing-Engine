spring.application.name=payflow-processor-service
server.port=8083

# =============================================================================
# DATASOURCE
# The processor service shares the same DB as the payment service.
# It needs to:
#   1. Read payments (to update status: PENDING → PROCESSING → COMPLETED/FAILED)
#   2. Write outbox events (PAYMENT_COMPLETED / PAYMENT_FAILED)
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5440/payflow_db
spring.datasource.username=payflow
spring.datasource.password=payflow_secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway OFF here — only the payment-service owns schema migrations.
# Having two services run Flyway against the same DB causes race conditions
# on startup and version conflicts. One service owns the schema. Others validate only.
spring.flyway.enabled=false

# =============================================================================
# REDIS — idempotency for event processing
# The processor checks Redis before processing a Kafka message to ensure
# it hasn't already processed this exact event (at-least-once → effectively-once)
# =============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6382
spring.data.redis.timeout=2000ms

# =============================================================================
# KAFKA — CONSUMER configuration
# The processor CONSUMES from payment.initiated and PRODUCES to payment.completed
# and payment.failed topics.
# =============================================================================
spring.kafka.bootstrap-servers=localhost:9092

# --- Consumer ---
# consumer group id: all instances of this service share the same group.
# CONCEPT — Consumer Groups:
#   Kafka delivers each message to ONE consumer in a group (load balancing).
#   If you run 3 instances of this service, Kafka splits the 3 partitions
#   across them — each instance handles 1 partition. Perfect horizontal scaling.
#   A different group (e.g. notification-service) gets its OWN copy of every message.
spring.kafka.consumer.group-id=payflow-processor-group
spring.kafka.consumer.auto-offset-reset=earliest

# CONCEPT — auto-offset-reset:
#   earliest = start from the beginning of the topic if no committed offset exists
#   latest   = start from new messages only (miss anything published before startup)
#   Use earliest in dev (replay all messages). Use latest in prod for new consumer groups.

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# CONCEPT — enable-auto-commit=false (CRITICAL for reliability):
#   By default Kafka auto-commits the offset every 5 seconds regardless of
#   whether you successfully processed the message.
#   With auto-commit: if your service crashes after commit but before processing,
#   the message is LOST — Kafka won't redeliver it.
#   With manual commit (AckMode.MANUAL): you only commit AFTER successful processing.
#   This gives at-least-once delivery — you might process twice, never zero times.
spring.kafka.consumer.enable-auto-commit=false

# --- Producer (for publishing results back to Kafka) ---
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# =============================================================================
# RETRY + DLQ configuration
# =============================================================================
# How many times to retry a failed payment before sending to DLQ
payflow.processor.max-retry-attempts=3
# Base delay for exponential backoff (ms). Doubles each retry: 1s, 2s, 4s
payflow.processor.retry-base-delay-ms=1000
# Simulated provider failure rate for testing (0.0 - 1.0)
payflow.processor.simulated-failure-rate=0.2

# Topic names
payflow.kafka.topics.payment-initiated=payment.initiated
payflow.kafka.topics.payment-completed=payment.completed
payflow.kafka.topics.payment-failed=payment.failed
payflow.kafka.topics.payment-dlq=payment.dlq

# =============================================================================
# ACTUATOR
# =============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
